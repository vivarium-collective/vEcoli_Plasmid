name: Docker Build and Security Scan

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

on:
  push:
    branches:
      - master
  pull_request:

  merge_group:

  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  buildx:
    runs-on: ubuntu-latest
    # Expose the Docker Hub token as an env var so the login/scan/upload steps
    # can be skipped on forks that don't have registry credentials configured
    # (secrets can't be referenced directly in step-level `if:` conditions).
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runscripts/container/Dockerfile
          load: true
          tags: vecoli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Analyze for critical and high CVEs
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        id: docker-scout-cves
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: vecoli:latest
          sarif-file: sarif.output.json
          summary: true

      - name: Upload SARIF result
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif.output.json
